// see https://docs.gradle.org/9.1/userguide/java_plugin.html
// see https://docs.gradle.org/9.1/userguide/application_plugin.html

plugins {
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

version = "1.0.0"

// NB we cannot use a shadow/fat jar with bouncy castle because that would
//    destroy the bouncy castle jce provider signature.
jar {
    manifest {
        attributes(
            'Implementation-Title': 'SSH Example',
            'Implementation-Version': project.version,
            'Main-Class': 'Example'
        )
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.beust:jcommander:1.82'      // see https://mvnrepository.com/artifact/com.beust/jcommander
    implementation 'org.slf4j:slf4j-simple:2.0.17'  // see https://mvnrepository.com/artifact/org.slf4j/slf4j-simple
    implementation 'com.hierynomus:sshj:0.40.0'     // see https://mvnrepository.com/artifact/com.hierynomus/sshj
}
